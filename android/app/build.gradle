plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
    id("com.facebook.react")
}

react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

// Key del SDK de Google Maps para Android. Nunca se commitea: sale de
// `android/local.properties` (ignorado por git) o de la variable de entorno
// MAPS_API_KEY en el CI. Sin ella el mapa carga gris, pero el APK compila.
def mapsApiKey = {
    def propsFile = rootProject.file("local.properties")
    if (propsFile.exists()) {
        def props = new Properties()
        propsFile.withInputStream { props.load(it) }
        def value = props.getProperty("MAPS_API_KEY")
        if (value != null && !value.isEmpty()) {
            return value
        }
    }
    return System.getenv("MAPS_API_KEY") ?: ""
}()
def jscFlavor = "io.github.react-native-community:jsc-android:2026004.+"

android {
    namespace "cl.chiloe.biodiversidad"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "cl.chiloe.biodiversidad"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"

        manifestPlaceholders = [MAPS_API_KEY: mapsApiKey]

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -fexceptions -frtti"
                arguments "-DANDROID_STL=c++_shared"
            }
        }

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
        }
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
